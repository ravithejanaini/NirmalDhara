<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">NirmalDhara on AWS, 9 October 2026</title>
<desc id="d">13 deployed parts in the Mumbai region: a rain check feeds a queue; one engine per site writes state and publishes events; a flood workflow decides alerts; a notifier sends them once to a topic; a publisher and a history writer keep two public files that a read-only site host serves to a phone. Photo reading, cameras and waste tracking, a scenario engine, alert channels to people and CloudFront are designed or off.</desc>
