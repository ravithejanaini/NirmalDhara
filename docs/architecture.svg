F3EDE1">History</text><text x="549.0" y="477.0" text-anchor="middle" font-size="14" fill="#A9B6C6">flood history file</text></g><g id="node-pu"><rect x="684" y="430" width="150" height="60" rx="6" fill="#16304A" stroke="#7FB7BE" stroke-width="1.6" /><text x="759.0" y="457.0" text-anchor="middle" font-size="16" font-weight="600" fill="#F3EDE1">Publisher</text><text x="759.0" y="477.0" text-anchor="middle" font-size="14" fill="#A9B6C6">the map file</text></g><g id="node-nt"><rect x="880" y="430" width="190" height="60" rx="6" fill="#16304A" stroke="#7FB7BE" stroke-width="1.6" /><text x="975.0" y="457.0" text-anchor="middle" font-size="16" font-weight="600" fill="#F3EDE1">Notifier</text><text x="975.0" y="477.0" text-anchor="middle" font-size="14" fill="#A9B6C6">sends each alert once</text></g><g id="node-tp"><rect x="880" y="540" width="190" height="60" rx="6" fill="#16304A" stroke="#7FB7BE" stroke-width="1.6" /><text x="975.0" y="567.0" text-anchor="middle" font-size="16" font-weight="600" fill="#F3EDE1">Alerts topic</text><text x="975.0" y="587.0" text-anchor="middle" font-size="14" fill="#A9B6C6">SNS</text></g><g id="node-ch"><rect x="880" y="640" width="190" height="60" rx="6" fill="none" stroke="#A9B6C6" stroke-width="1.4" stroke-dasharray="6 5" /><text x="975.0" y="667.0" text-anchor="middle" font-size="16" font-weight="600" fill="#A9B6C6">SMS, chat, email</text><text x="975.0" y="687.0" text-anchor="middle" font-size="14" fill="#A9B6C6">to people</text></g><g id="node-bk"><rect x="464" y="550" width="170" height="60" rx="6" fill="#16304A" stroke="#7FB7BE" stroke-width="1.6" /><text x="549.0" y="577.0" text-anchor="middle" font-size="16" font-weight="600" fill="#F3EDE1">Public bucket</text><text x="549.0" y="597.0" text-anchor="middle" font-size="14" fill="#A9B6C6">map and history files</text></g><g id="node-sh"><rect x="464" y="660" width="170" height="60" rx="6" fill="#16304A" stroke="#7FB7BE" stroke-width="1.6" /><text x="549.0" y="687.0" text-anchor="middle"