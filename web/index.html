<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NirmalDhara · Hyderabad</title>
<meta name="description" content="Floodwater depth at known waterlogging points in Hyderabad, and whether each kind of vehicle can pass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="glyph.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="sheet.css">
<link rel="stylesheet" href="guide.css">
</head>
<body class="map-page">
<!-- Controls come first in the page, so a keyboard user reaches them before the eight sites. They are
     placed by the style sheet, and the map is behind them whatever the order here. -->
<header class="masthead">
  <h1 class="display wordmark">NirmalDhara</h1>
  <p class="label place">Hyderabad</p>
  <a class="masthead-link label" href="offenders.html">Repeat floods →</a>
  <p id="data-status" class="data-status" role="status" aria-live="polite" hidden></p>
</header>

<div id="guide"></div>

<div id="map" role="application" aria-label="Map of Hyderabad"></div>

<section id="sheet" class="paper sheet site-sheet" role="dialog" aria-labelledby="sheet-title" hidden></section>

<p id="map-error" class="map-error" hidden>The map could not be loaded. Check the connection and reload.</p>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Keeps the page and the last map file for when there is no signal (sw.js). Needs HTTPS or localhost.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
<script type="module">
import { createMap } from "./map.js";
import { startLive } from "./data.js";
import { SiteLayer } from "./sites.js";
import { SiteSheet } from "./sheet.js";
import { Guide } from "./guide.js";
import { mountSection, forgetSection } from "./section.js";

const status = document.getElementById("data-status");
let map;
try {
  map = await createMap("map");
  window.nirmaldhara = { map };
  document.body.classList.add("map-ready");
} catch (error) {
  document.getElementById("map-error").hidden = false;
  console.error(error);
}

if (map) {
  const layer = new SiteLayer(map);
  let sheet = null, guide = null;
  const live = startLive({
    url: "data/hyderabad.json",
    onData: (load) => {
      layer.apply(load);
      if (guide) guide.update(load.data.sites.values());
      // The open sheet follows its site: redrawn when the site changes, closed if it is removed.
      if (sheet && sheet.site) {
        if (load.diff.changed.includes(sheet.site.id)) sheet.update(load.data.sites.get(sheet.site.id));
        if (load.diff.removed.includes(sheet.site.id)) sheet.close();
      }
    },
    onStatus: (notice) => {
      status.hidden = !notice;
      status.textContent = notice ? notice.text : "";
      status.dataset.level = notice ? notice.level : "";
    },
  });
  layer.keepAges(live.now);
  // Each time the sheet draws itself, the cross-section is drawn into the slot it leaves.
  document.getElementById("sheet").addEventListener("sheet-drawn", (event) => {
    const slot = event.currentTarget.querySelector("[data-slot=section]");
    mountSection(slot, event.detail.site);
    if (event.detail.model.wet) {
      slot.insertAdjacentHTML("beforeend",
        '<p class="section-caption">To scale. Red marks: where bikes, cars and people must stop.</p>');
    }
  });
  sheet = new SiteSheet(document.getElementById("sheet"), live.now);
  guide = new Guide(document.getElementById("guide"), live.now);
  if (live.current()) guide.update(live.current().sites.values());
  Object.assign(window.nirmaldhara, { layer, live, sheet });
}
</script>
</body>
</html>
