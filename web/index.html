<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>NirmalDhara · Hyderabad</title>
<meta name="description" content="Floodwater depth at known waterlogging points in Hyderabad, and whether each kind of vehicle can pass.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="map.css">
</head>
<body class="map-page">
<div id="map" role="application" aria-label="Map of Hyderabad"></div>

<header class="masthead">
  <h1 class="display wordmark">NirmalDhara</h1>
  <p class="label place">Hyderabad</p>
</header>

<p id="map-error" class="map-error" hidden>The map could not be loaded. Check the connection and reload.</p>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
import { createMap } from "./map.js";

try {
  window.map = await createMap("map");
  document.body.classList.add("map-ready");
} catch (error) {
  document.getElementById("map-error").hidden = false;
  console.error(error);
}
</script>
</body>
</html>
