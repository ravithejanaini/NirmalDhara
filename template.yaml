AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  NirmalDhara: rain check, state engine, flood workflow and notifier.
  See ARCHITECTURE.md sections 5 and 6, and DESIGN.md.

Parameters:
  City:
    Type: String
    Default: hyderabad
  # CloudFront needs the AWS account to be verified by Support first; without that, creating
  # the distribution fails and rolls the whole stack back. Until then the site is served by
  # SiteFunction. Switch on with: sam deploy ... --parameter-overrides EnableCloudFront=true
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  UseFunctionUrl: !Not [!Condition UseCloudFront]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        SITES_TABLE: !Ref SitesTable
        FLOODS_TABLE: !Ref FloodsTable
        ALERTS_TABLE: !Ref AlertsTable
        EVENT_BUS: !Ref Bus
        CITY: !Ref City

Resources:
  Bus:
    Type: AWS::Events::EventBus
    Properties:
      Name: nirmaldhara

  # Past events can be replayed to demonstrate recorded floods and to test changes.
  BusArchive:
    Type: AWS::Events::Archive
    Properties:
      SourceArn: !GetAtt Bus.Arn
      RetentionDays: 30

  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: city, AttributeType: S }
        - { AttributeName: site_id, AttributeType: S }
      KeySchema:
        - { AttributeName: city, KeyType: HASH }
        - { AttributeName: site_id, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EngineDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Message group = site id, so one site's messages are handled in order, one at a time.
  EngineQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EngineDeadLetters.Arn
        maxReceiveCount: 3

  EngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.engine.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SitesTable }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref Bus }
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt EngineQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  RainFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.rain.handler
      Timeout: 120  # the forecast service has taken up to 16 seconds per request
      Environment:
        Variables:
          ENGINE_QUEUE_URL: !Ref EngineQueue
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt EngineQueue.QueueName }
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  # One item per site per flood, owned by the workflow.
  FloodsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: site_id, AttributeType: S }
        - { AttributeName: start, AttributeType: N }
      KeySchema:
        - { AttributeName: site_id, KeyType: HASH }
        - { AttributeName: start, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One item per alert id. Claiming the id before sending is what stops repeats.
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: alert_id, AttributeType: S }
      KeySchema:
        - { AttributeName: alert_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AlertsTopic:
    Type: AWS::SNS::Topic

  # Events the reactor or the notifier could not handle after their retries.
  WorkflowDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ReactorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.flood.reactor
      DeadLetterQueue: { Type: SQS, TargetArn: !GetAtt WorkflowDeadLetters.Arn }
      Environment:
        Variables:
          FLOOD_STATE_MACHINE: !Ref FloodStateMachine
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FloodsTable }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref Bus }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt FloodStateMachine.Name }
      Events:
        SiteChanged:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref Bus
            Pattern:
              source: [nirmaldhara]
              detail-type: [SiteStateChanged, ReadingAccepted]

  TickFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.flood.tick
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref FloodsTable }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref Bus }

  FloodStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/flood.asl.json
      DefinitionSubstitutions:
        TickFunctionArn: !GetAtt TickFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref TickFunction }
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.notifier.handler
      DeadLetterQueue: { Type: SQS, TargetArn: !GetAtt WorkflowDeadLetters.Arn }
      Environment:
        Variables:
          ALERTS_TOPIC: !Ref AlertsTopic
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref Bus }
      Events:
        AlertRequested:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref Bus
            Pattern:
              source: [nirmaldhara]
              detail-type: [AlertRequested, PhotoRequested]

  WorkflowDeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An alert or a workflow step failed for good and needs a person.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt WorkflowDeadLetters.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  FloodFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A flood's timer loop stopped without closing its event.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - { Name: StateMachineArn, Value: !Ref FloodStateMachine }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # The public map file, and later the web app, are served from here by CloudFront (PUB-04).
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # Every site change lands here first. At most two publisher runs at a time drain it, ten
  # events each, so a flood of readings cannot start more than two full reads at once.
  PublishQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WorkflowDeadLetters.Arn
        maxReceiveCount: 3

  PublishQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PublishQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt PublishQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !GetAtt PublishRule.Arn }

  PublishRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref Bus
      EventPattern:
        source: [nirmaldhara]
        detail-type: [SiteStateChanged, ReadingAccepted]
      Targets:
        - Id: publish-queue
          Arn: !GetAtt PublishQueue.Arn

  # The public address. CloudFront reads the private bucket through an origin access control,
  # so nothing in the bucket is reachable except through this distribution.
  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: NirmalDhara public site and map file
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200          # includes India; PriceClass_100 does not
        Origins:
          - Id: public-bucket
            DomainName: !GetAtt PublicBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: public-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingOptimized (honours the object's own Cache-Control, so the
          # map file's max-age=15 holds) and SecurityHeadersPolicy (HSTS, nosniff, frame options).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          # A missing object is a 403 through an origin access control. Do not remember it long:
          # the map file does not exist until the first publish.
          - ErrorCode: 403
            ErrorCachingMinTTL: 5

  PublicBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref PublicBucket
      PolicyDocument:
        Statement:
          - Sid: ReadOnlyThroughCloudFront
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${PublicBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # Stands in for CloudFront until the account is verified. Read-only: serves one object from
  # the bucket per request, over HTTPS, in the Mumbai region.
  SiteFunction:
    Type: AWS::Serverless::Function
    Condition: UseFunctionUrl
    Properties:
      Handler: handlers.site.handler
      Environment:
        Variables:
          PUBLIC_BUCKET: !Ref PublicBucket
      Policies:
        - S3ReadPolicy: { BucketName: !Ref PublicBucket }
      FunctionUrlConfig:
        AuthType: NONE

  # Each site's past floods, for the repeat offenders page. Rebuilt when a flood closes, and
  # hourly (which also picks up records that scripts/reset.py removes).
  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.history.handler
      DeadLetterQueue: { Type: SQS, TargetArn: !GetAtt WorkflowDeadLetters.Arn }
      Environment:
        Variables:
          PUBLIC_BUCKET: !Ref PublicBucket
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - DynamoDBReadPolicy: { TableName: !Ref FloodsTable }
        - S3CrudPolicy: { BucketName: !Ref PublicBucket }
      Events:
        FloodClosed:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref Bus
            Pattern:
              source: [nirmaldhara]
              detail-type: [EventClosed]
        EveryHour:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)

  PublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.publisher.handler
      DeadLetterQueue: { Type: SQS, TargetArn: !GetAtt WorkflowDeadLetters.Arn }
      Environment:
        Variables:
          PUBLIC_BUCKET: !Ref PublicBucket
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref SitesTable }
        - S3CrudPolicy: { BucketName: !Ref PublicBucket }
      Events:
        # Site changes arrive through PublishQueue. No batching window: one measured 4 to 19
        # seconds of delay with a 2-second window. Two workers at most, ten events a run.
        Changes:
          Type: SQS
          Properties:
            Queue: !GetAtt PublishQueue.Arn
            BatchSize: 10
            ScalingConfig:
              MaximumConcurrency: 2
        EveryFifteenMinutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  DeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A message for the state engine failed three times.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt EngineDeadLetters.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

Outputs:
  SitesTable:
    Value: !Ref SitesTable
  EngineQueueUrl:
    Value: !Ref EngineQueue
  EventBus:
    Value: !Ref Bus
  AlertsTopic:
    Value: !Ref AlertsTopic
  PublicBucket:
    Value: !Ref PublicBucket
  SiteUrl:
    Value: !If
      - UseCloudFront
      - !Sub https://${SiteDistribution.DomainName}
      - !GetAtt SiteFunctionUrl.FunctionUrl
    Description: The public address of the site
  SiteDistributionId:
    Condition: UseCloudFront
    Value: !Ref SiteDistribution
  FloodStateMachine:
    Value: !Ref FloodStateMachine
